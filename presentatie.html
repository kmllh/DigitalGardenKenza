# Make-up is meer dan alleen producten aanbrengen

Van huidtextuur en productformules tot make-uptechnieken

---

# Waarom make-up?

Make-up is een van mijn favoriete hobby's.

Ik vind het leuk om nieuwe looks te ontdekken en creatief bezig te zijn.

---

# Waar haal ik inspiratie vandaan?

- TikTok
- YouTube
- Pinterest
- Make-up tutorials

Ik probeer nieuwe technieken vooral bij mezelf uit en soms ook bij anderen.

---

# Waarom is huidtype belangrijk?

Niet iedere huid is hetzelfde.

- Droge huid
- Vette huid
- Gecombineerde huid
- Normale huid

Het huidtype beïnvloedt welke producten prettig werken.

---

# Water-based en silicone-based make-up

Water-based producten hebben vaak een lichte textuur.

Silicone-based producten kunnen de huid gladder laten lijken.

De ingrediënten en de volledige formule bepalen hoe producten samenwerken.

---

# Waarom is skin prep belangrijk?

Een goede voorbereiding helpt om make-up mooi aan te brengen.

- De huid reinigen
- Hydrateren
- Eventueel primer gebruiken
- Producten rustig laten intrekken


---

# Huidtextuur: waar let je op?

Huidtype en huidtextuur zijn niet hetzelfde.

- Droge plekjes kunnen foundation benadrukken.
- Zichtbare poriën zijn normaal.
- Fijne lijntjes kunnen meer opvallen door te veel poeder.
- Acne en oneffenheden vragen soms om een andere aanpak.

Het doel is om producten aan te passen aan de huid.

---

# Hoe herken je een productformule?

Kijk naar de ingrediëntenlijst (INCI).

- Water staat vaak als `Aqua` vermeld.
- Siliconen herken je bijvoorbeeld aan `Dimethicone`.
- Niet elk product met water is automatisch water-based.
- De volledige formule bepaalt hoe producten samenwerken.

Tip: test je primer en foundation samen voordat je ze voor een speciale gelegenheid gebruikt.

---

# Foundation aanbrengen

Er zijn verschillende manieren om foundation aan te brengen.

- **Kwast:** handig om gericht te werken.
- **Vochtige spons:** voor een zachte, geblende finish.
- **Vingers:** geven controle bij sommige producten.

Ik vind het interessant om te zien hoe dezelfde foundation met een andere techniek een ander resultaat geeft.

---

# Cream versus powder

Cream- en poederproducten hebben verschillende eigenschappen.

- Cream blush geeft vaak een frisse uitstraling.
- Powder blush kan helpen om kleur op te bouwen.
- Cream contour is makkelijk te blenden.
- Setting powder kan glans verminderen.

De keuze hangt af van de huid, de gewenste finish en de andere producten.

---

# Blending en laagjes opbouwen

Een mooie make-uplook begint niet met veel product.

- Begin met een kleine hoeveelheid.
- Bouw dekking geleidelijk op.
- Blend de overgangen zorgvuldig.
- Gebruik niet meer poeder dan nodig.

Door te oefenen ontdek ik welke technieken voor mij het beste werken.

---

# Make-up voor verschillende gelegenheden

**Natural make-up**

Een lichte basis met subtiele kleuren.

**Soft glam**

Een zachte, elegante look met meer definitie.

**Bridal make-up**

Een look waarbij comfort, houdbaarheid en het effect op foto's belangrijk zijn.

---

# Veelvoorkomende make-upproblemen

**Foundation wordt vlekkerig**

Dit kan komen door huidvoorbereiding, productcombinaties of de manier van aanbrengen.

**Make-up gaat rullen**

Sommige producten vormen kleine rolletjes als je ze over elkaar aanbrengt.

**Concealer kruipt in lijntjes**

Probeer minder product en breng poeder voorzichtig aan.

---

# Wat heb ik zelf geleerd?

Ik leer vooral door tutorials te bekijken en technieken zelf uit te proberen.

Ik heb ontdekt dat:

- Een goede basis belangrijk is.
- Niet ieder product bij iedere huid past.
- De manier van aanbrengen veel verschil maakt.
- Oefenen helpt om betere resultaten te krijgen.

---

# Mijn conclusie

Make-up gaat voor mij niet alleen over mooie looks.

Ik vind het vooral interessant om te begrijpen waarom bepaalde producten en technieken wel of niet werken.

Door te experimenteren leer ik steeds meer over huidtextuur, ingrediënten en verschillende manieren van aanbrengen.

---
